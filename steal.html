<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroFlash Pro // Cyber Edition</title>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-deep: #06080e;
            --bg-card: rgba(15, 20, 32, 0.75);
            --bg-input: #0b0e17;
            --border-neon: rgba(0, 243, 255, 0.2);
            --border-neon-strong: #00f3ff;
            --accent-cyan: #00f3ff;
            --accent-magenta: #d900ff;
            --accent-green: #00ff9d;
            --text-bright: #f0f6fc;
            --text-dim: #8b949e;
            --font-code: 'Fira Code', 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(217, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 243, 255, 0.08) 0%, transparent 40%);
            color: var(--text-bright);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navigatiebalk */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-neon);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .db-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-weight: 600;
        }

        .db-badge.offline {
            background: rgba(255, 0, 85, 0.1);
            border-color: #ff0055;
            color: #ff0055;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: var(--text-bright);
            border-color: var(--border-neon);
            background: rgba(0, 243, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(217, 0, 255, 0.2));
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        /* Inhoud Vensters */
        .content {
            flex: 1;
            display: none;
            padding: 20px;
            gap: 16px;
            overflow: hidden;
        }

        .content.active {
            display: flex;
            flex-direction: column;
        }

        /* Toolbars */
        .toolbar {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-neon);
            align-items: center;
            flex-wrap: wrap;
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), #00a2ff);
            color: #030712;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button.btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.6);
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-bright);
            border: 1px solid var(--border-neon);
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn-secondary:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        input[type="text"], select {
            background: var(--bg-input);
            border: 1px solid var(--border-neon);
            color: var(--text-bright);
            padding: 9px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        /* Editor Layout */
        .editor-container {
            display: flex;
            flex: 1;
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            overflow: hidden;
            background: #05070c;
        }

        textarea#codeEditor {
            flex: 1;
            background: transparent;
            color: #e6edf3;
            font-family: var(--font-code);
            padding: 16px;
            border: none;
            resize: none;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            tab-size: 4;
        }

        /* Web Host Studio Pro */
        .webhost-workspace {
            display: flex;
            flex: 1;
            gap: 16px;
            overflow: hidden;
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        .viewport-frame {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .viewport-frame.laptop { width: 1024px; height: 95%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .viewport-frame.tablet { width: 768px; height: 95%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .viewport-frame.mobile { width: 375px; height: 800px; border: 12px solid #1a1d26; border-radius: 36px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        .web-console {
            height: 150px;
            background: #020305;
            border-top: 1px solid var(--border-neon);
            width: 100%;
            padding: 10px;
            font-family: var(--font-code);
            font-size: 12px;
            overflow-y: auto;
            color: #00ff9d;
        }

        /* Terminal Output */
        #terminalOutput {
            flex: 1;
            background: #020305;
            color: var(--accent-cyan);
            font-family: var(--font-code);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-neon);
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Grid voor projecten & woordenboek */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(8px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-cyan);
        }

        .card h3 {
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }

        .card pre {
            background: #030509;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-dim);
            max-height: 150px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- NAVIGATIEBAR -->
    <nav>
        <div class="brand">
            ⚡ MICROFLASH PRO
            <span id="dbBadge" class="db-badge">Verbinden...</span>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('editor')">📝 IDE Editor</button>
            <button class="tab-btn" onclick="switchTab('terminal')">🔌 Serial Flasher</button>
            <button class="tab-btn" onclick="switchTab('webhost')">🌐 Web Host Studio Pro</button>
            <button class="tab-btn" onclick="switchTab('dictionary')">📚 Woordenboek</button>
            <button class="tab-btn" onclick="switchTab('library')">☁️ Mijn Cloud Database</button>
        </div>
    </nav>

    <!-- TAB 1: CODE EDITOR -->
    <div id="editor" class="content active">
        <div class="toolbar">
            <input type="text" id="projectName" placeholder="Projectnaam..." value="Dolphin0X_App" style="width: 220px;">
            <button class="btn-primary" onclick="saveToCloud()">☁️ Opslaan in Database</button>
            <button class="btn-secondary" onclick="document.getElementById('fileUpload').click()">📂 Open Bestand</button>
            <input type="file" id="fileUpload" style="display: none;" onchange="handleFileUpload(event)">
            <button class="btn-secondary" onclick="downloadCode()">⬇️ Download Code</button>
            <button class="btn-secondary" onclick="clearEditor()">🗑️ Wis</button>
        </div>
        <div class="editor-container">
            <textarea id="codeEditor" spellcheck="false" placeholder="Typ hier je C++, Python, HTML, CSS of JavaScript code..."></textarea>
        </div>
    </div>

    <!-- TAB 2: SERIAL TERMINAL / FLASHER -->
    <div id="terminal" class="content">
        <div class="toolbar">
            <button class="btn-primary" id="connectBtn" onclick="toggleConnection()">🔌 Verbind met Microcontroller</button>
            <button class="btn-secondary" onclick="sendCodeToSerial()">⚡ Run Code over Serial</button>
            <button class="btn-secondary" onclick="sendSerialCtrlC()">🛑 Stop (Ctrl+C)</button>
            <button class="btn-secondary" onclick="clearTerminal()">🗑️ Wis Scherm</button>
            <select id="baudRate">
                <option value="115200">115200 Baud (ESP32 / MicroPython)</option>
                <option value="9600">9600 Baud (Arduino Uno)</option>
            </select>
        </div>
        <div id="terminalOutput">Wacht op seriële USB-verbinding...\nKlik op 'Verbind met Microcontroller' om je ESP32 of Arduino te koppelen via WebSerial.</div>
    </div>

    <!-- TAB 3: WEB HOST STUDIO PRO -->
    <div id="webhost" class="content">
        <div class="toolbar">
            <button class="btn-primary" onclick="updatePreview()">🔄 Run / Refresh Preview</button>
            <select id="viewportSelect" onchange="changeViewport(this.value)">
                <option value="desktop">🖥️ Desktop (100%)</option>
                <option value="laptop">💻 Laptop (1024px)</option>
                <option value="tablet">📱 Tablet (768px)</option>
                <option value="mobile">📱 Mobiel (375px)</option>
            </select>
            <select id="frameworkInjector" onchange="injectFramework(this.value)">
                <option value="">➕ Voeg Framework/CDN Toe...</option>
                <option value="tailwind">Tailwind CSS (Styling)</option>
                <option value="three">Three.js (3D Graphics)</option>
                <option value="fontawesome">FontAwesome (Icoontjes)</option>
                <option value="chartjs">Chart.js (Grafieken)</option>
                <option value="bootstrap">Bootstrap 5 (UI Framework)</option>
            </select>
            <button class="btn-secondary" onclick="openNewTab()">🚀 Open in Nieuw Tabblad</button>
        </div>
        <div class="webhost-workspace">
            <div class="preview-wrapper">
                <iframe id="previewFrame" class="viewport-frame"></iframe>
                <div class="web-console" id="webConsole">
                    <span style="color: var(--text-dim);">-- Web Console Log Output --</span>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 4: CODE WOORDENBOEK -->
    <div id="dictionary" class="content">
        <div class="toolbar">
            <input type="text" id="searchDict" placeholder="Zoek op taak of microcontroller (bijv. ESP32, Uno, Wi-Fi, HTML)..." onkeyup="filterDictionary()" style="width: 100%;">
        </div>
        <div class="grid-container" id="dictGrid"></div>
    </div>

    <!-- TAB 5: MIJN CLOUD DATABASE -->
    <div id="library" class="content">
        <div class="toolbar">
            <h2 style="font-size: 1.1rem; color: var(--accent-cyan);">☁️ Projecten in je Firestore Database</h2>
            <button class="btn-secondary" onclick="loadDatabaseProjects()" style="margin-left: auto;">🔄 Verversen</button>
        </div>
        <div class="grid-container" id="libraryGrid"></div>
    </div>

    <div class="toast" id="toast">Melding...</div>

    <script>
        // --- 1. FIREBASE INITIALISATIE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCJSfoSfGu1ubYin2-YXCxSL-GU4pKy0ik",
            authDomain: "microcoding-9d747.firebaseapp.com",
            projectId: "microcoding-9d747",
            storageBucket: "microcoding-9d747.firebasestorage.app",
            messagingSenderId: "637149557384",
            appId: "1:637149557384:web:5b2a15c215c5c331f2e53d",
            measurementId: "G-W7PBFVJQGL"
        };

        let db = null;
        let isCloudActive = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isCloudActive = true;
            document.getElementById('dbBadge').innerText = '🟢 Cloud Database Online';
            document.getElementById('dbBadge').classList.remove('offline');
        } catch (e) {
            console.warn("Firebase fout:", e);
            document.getElementById('dbBadge').innerText = '🟡 Lokaal (Offline Modus)';
            document.getElementById('dbBadge').classList.add('offline');
        }

        // --- 2. TABS & UI ---
        function switchTab(tabId) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            if (tabId === 'library') loadDatabaseProjects();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        // --- 3. EDITOR FUNCTIES ---
        function downloadCode() {
            const code = document.getElementById('codeEditor').value;
            const name = document.getElementById('projectName').value || 'code';
            let ext = '.txt';
            if (code.includes('<html>')) ext = '.html';
            else if (code.includes('#include')) ext = '.cpp';
            else if (code.includes('import machine') || code.includes('import time')) ext = '.py';

            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name + ext;
            a.click();
            URL.revokeObjectURL(url);
            showToast('💾 Code gedownload!');
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                document.getElementById('codeEditor').value = evt.target.result;
                document.getElementById('projectName').value = file.name.split('.')[0];
                showToast('📂 Bestand ingeladen!');
            };
            reader.readAsText(file);
        }

        function clearEditor() {
            if(confirm("Weet je zeker dat je het editorvenster wilt wissen?")) {
                document.getElementById('codeEditor').value = '';
            }
        }

        function insertCode(snippet) {
            const editor = document.getElementById('codeEditor');
            editor.value += (editor.value.length > 0 ? '\n\n' : '') + snippet;
            switchTab('editor');
            showToast('⚡ Code ingevoegd!');
        }

        // --- 4. CLOUD DATABASE & OPSLAG ---
        async function saveToCloud() {
            const name = document.getElementById('projectName').value.trim() || 'Naamloos_Project';
            const code = document.getElementById('codeEditor').value;

            if (!code) {
                alert("Je kunt geen lege code opslaan!");
                return;
            }

            // Altijd lokaal opslaan als backup
            let localProjects = JSON.parse(localStorage.getItem('microflash_projects') || '[]');
            const index = localProjects.findIndex(p => p.name === name);
            const projectData = { name, code, updated: new Date().toLocaleString() };

            if (index >= 0) localProjects[index] = projectData;
            else localProjects.push(projectData);
            localStorage.setItem('microflash_projects', JSON.stringify(localProjects));

            // Naar Cloud Database sturen als beschikbaar
            if (isCloudActive && db) {
                try {
                    await db.collection('projects').doc(name).set({
                        name: name,
                        code: code,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('☁️ Opgeslagen in Cloud Database!');
                    return;
                } catch (err) {
                    console.error("Firestore Save Fout:", err);
                }
            }

            showToast('💾 Opgeslagen in Lokale Browser Database!');
        }

        async function loadDatabaseProjects() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '<p style="color: var(--text-dim);">Laden van projecten uit database...</p>';
            let projects = [];

            if (isCloudActive && db) {
                try {
                    const snapshot = await db.collection('projects').get();
                    snapshot.forEach(doc => {
                        projects.push(doc.data());
                    });
                } catch (e) {
                    console.warn("Fout bij ophalen Cloud database:", e);
                }
            }

            // Fallback op lokale opslag als cloud leeg is of faalt
            if (projects.length === 0) {
                projects = JSON.parse(localStorage.getItem('microflash_projects') || '[]');
            }

            grid.innerHTML = '';
            if (projects.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-dim);">Nog geen projecten gevonden in je database. Maak een code in de editor en klik op Opslaan!</p>';
                return;
            }

            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <pre>${p.code.substring(0, 150)}...</pre>
                    <div style="display: flex; gap: 8px; margin-top: auto;">
                        <button class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="loadProjectCode('${encodeURIComponent(p.name)}', '${encodeURIComponent(p.code)}')">📂 Openen</button>
                        <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.85rem; color: #ff0055;" onclick="deleteProject('${p.name}')">🗑️ Verwijder</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function loadProjectCode(name, code) {
            document.getElementById('projectName').value = decodeURIComponent(name);
            document.getElementById('codeEditor').value = decodeURIComponent(code);
            switchTab('editor');
            showToast('📂 Project geladen in Editor!');
        }

        async function deleteProject(name) {
            if (confirm(`Wil je project '${name}' echt uit de database verwijderen?`)) {
                if (isCloudActive && db) {
                    try { await db.collection('projects').doc(name).delete(); } catch(e){}
                }
                let localProjects = JSON.parse(localStorage.getItem('microflash_projects') || '[]');
                localProjects = localProjects.filter(p => p.name !== name);
                localStorage.setItem('microflash_projects', JSON.stringify(localProjects));
                loadDatabaseProjects();
                showToast('🗑️ Project verwijderd.');
            }
        }

        // --- 5. WEB HOST STUDIO PRO ---
        function updatePreview() {
            const code = document.getElementById('codeEditor').value;
            const iframe = document.getElementById('previewFrame');
            const consoleDiv = document.getElementById('webConsole');
            consoleDiv.innerHTML = '<span style="color: var(--text-dim);">-- Web Console Log Output --</span>';

            // Console interceptor script om console.log uit iframe te vangen
            const consoleScript = `<script>
                (function(){
                    const oldLog = console.log;
                    const oldError = console.error;
                    console.log = function(...args){
                        window.parent.postMessage({type: 'log', msg: args.join(' ')}, '*');
                        oldLog.apply(console, args);
                    };
                    console.error = function(...args){
                        window.parent.postMessage({type: 'error', msg: args.join(' ')}, '*');
                        oldError.apply(console, args);
                    };
                })();
            <\/script>`;

            iframe.srcdoc = consoleScript + (code || "<html><body style='color:#333;font-family:sans-serif;text-align:center;padding-top:50px;'><h2>Geen HTML code gevonden</h2><p>Voeg HTML/CSS toe in de editor en klik op Update.</p></body></html>");
            showToast('🌐 Web Host Studio Vernieuwd!');
        }

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type) {
                const consoleDiv = document.getElementById('webConsole');
                const line = document.createElement('div');
                line.style.color = e.data.type === 'error' ? '#ff0055' : '#00ff9d';
                line.textContent = `[${e.data.type.toUpperCase()}] ${e.data.msg}`;
                consoleDiv.appendChild(line);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        });

        function changeViewport(size) {
            const iframe = document.getElementById('previewFrame');
            iframe.className = 'viewport-frame ' + size;
        }

        function injectFramework(fw) {
            if (!fw) return;
            const cdns = {
                tailwind: '<script src="https://cdn.tailwindcss.com"><' + '/script>',
                three: '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><' + '/script>',
                fontawesome: '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">',
                chartjs: '<script src="https://cdn.jsdelivr.net/npm/chart.js"><' + '/script>',
                bootstrap: '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">'
            };
            
            const editor = document.getElementById('codeEditor');
            editor.value = (cdns[fw] || '') + '\n' + editor.value;
            document.getElementById('frameworkInjector').value = '';
            showToast(`➕ ${fw.toUpperCase()} toegevoegd aan code!`);
        }

        function openNewTab() {
            const code = document.getElementById('codeEditor').value;
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        // --- 6. WEBSERIAL API (HARDWARE FLASHER) ---
        let port, reader, outputStream;

        async function toggleConnection() {
            if (port) await disconnectSerial();
            else await connectSerial();
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                const baudRate = parseInt(document.getElementById('baudRate').value);
                await port.open({ baudRate: baudRate });
                
                document.getElementById('connectBtn').innerText = '🔌 Verbreek Serial Verbinding';
                document.getElementById('connectBtn').style.background = '#ff0055';
                printToTerminal(`\n[+] Succesvol verbonden op ${baudRate} Baud.\n`);
                
                const encoder = new TextEncoderStream();
                outputStream = encoder.writable.getWriter();
                encoder.readable.pipeTo(port.writable);
                readSerialLoop();
            } catch (err) {
                printToTerminal(`\n[!] Fout bij verbinden: ${err.message}\n(Gebruik Chrome/Edge voor WebSerial ondersteuning)`);
            }
        }

        async function disconnectSerial() {
            if (reader) { await reader.cancel(); reader = null; }
            if (outputStream) { await outputStream.close(); outputStream = null; }
            if (port) { await port.close(); port = null; }
            document.getElementById('connectBtn').innerText = '🔌 Verbind met Microcontroller';
            document.getElementById('connectBtn').style.background = 'linear-gradient(135deg, var(--accent-cyan), #00a2ff)';
            printToTerminal('\n[-] Verbinding verbroken.\n');
        }

        async function readSerialLoop() {
            const decoder = new TextDecoderStream();
            port.readable.pipeTo(decoder.writable);
            reader = decoder.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    printToTerminal(value, false);
                }
            } catch (err) { console.error("Read Error:", err); } 
            finally { reader.releaseLock(); }
        }

        async function sendCodeToSerial() {
            if (!outputStream) return alert("Verbind eerst met een controller via Serial!");
            const code = document.getElementById('codeEditor').value;
            printToTerminal('\n[>] Versturen naar board...\n');
            const lines = code.split('\n');
            for (let l of lines) { await outputStream.write(l + '\r\n'); }
        }

        async function sendSerialCtrlC() {
            if (outputStream) await outputStream.write('\x03');
        }

        function printToTerminal(text, newline = true) {
            const term = document.getElementById('terminalOutput');
            term.textContent += text + (newline ? '\n' : '');
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() { document.getElementById('terminalOutput').textContent = ''; }

        // --- 7. WOORDENBOEK ---
        const dictionarySnippets = [
            {
                title: "ESP32-C3 SuperMini LED Blink (C++)",
                tags: "esp32 c3 supermini blink led arduino",
                code: `// Blauwe status-LED zit op GPIO 8 bij de SuperMini\nconst int LED_PIN = 8;\n\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(LED_PIN, HIGH);\n  delay(500);\n  digitalWrite(LED_PIN, LOW);\n  delay(500);\n}`
            },
            {
                title: "Arduino Uno R3 Blink (C++)",
                tags: "arduino uno r3 blink led",
                code: `void setup() {\n  pinMode(13, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(13, HIGH);\n  delay(1000);\n  digitalWrite(13, LOW);\n  delay(1000);\n}`
            },
            {
                title: "MicroPython ESP32 Wi-Fi Scanner",
                tags: "python micropython esp32 wifi network",
                code: `import network\n\nwlan = network.WLAN(network.STA_IF)\nwlan.active(True)\n\nprint("Scannen naar Wi-Fi netwerken...")\nfor net in wlan.scan():\n    print("SSID:", net[0].decode('utf-8'), "| Signaal:", net[3], "dBm")`
            },
            {
                title: "Three.js 3D Draaiende Kubus (Web Host)",
                tags: "html 3d threejs webhost canvas",
                code: `<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>\n<body style="margin:0;overflow:hidden;background:#05070c;">\n<script>\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);\n  const renderer = new THREE.WebGLRenderer();\n  renderer.setSize(window.innerWidth, window.innerHeight);\n  document.body.appendChild(renderer.domElement);\n\n  const geometry = new THREE.BoxGeometry();\n  const material = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });\n  const cube = new THREE.Mesh(geometry, material);\n  scene.add(cube);\n  camera.position.z = 3;\n\n  function animate() {\n    requestAnimationFrame(animate);\n    cube.rotation.x += 0.01;\n    cube.rotation.y += 0.01;\n    renderer.render(scene, camera);\n  }\n  animate();\n<\/script>\n</body>`
            }
        ];

        function renderDictionary(filter = "") {
            const grid = document.getElementById('dictGrid');
            grid.innerHTML = '';
            dictionarySnippets.forEach(item => {
                if(filter && !item.tags.toLowerCase().includes(filter.toLowerCase()) && !item.title.toLowerCase().includes(filter.toLowerCase())) return;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <pre>${item.code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
                    <button class="btn-secondary" onclick="insertCode(decodeURIComponent('${encodeURIComponent(item.code)}'))">➕ Invoegen in Editor</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterDictionary() {
            renderDictionary(document.getElementById('searchDict').value);
        }

        // Boot
        renderDictionary();
    </script>
